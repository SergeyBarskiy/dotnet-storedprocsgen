name: BuildAndPublish

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

jobs:
  build:
    env:
      BUILD_CONFIG: 'Release'
      SOLUTION: 'dotnet-storedprocsgen.sln'
      MAIN_PROJECT: 'dotnet-storedprocsgen.csproj'
    
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1.0.5
        with: 
          nuget-version: latest

      - name: Restore dependencies
        working-directory: ./Source/dotnet-storedprocsgen
        run: dotnet restore $MAIN_PROJECT

      - name: Build
        working-directory: ./Source/dotnet-storedprocsgen
        run: dotnet build $MAIN_PROJECT --configuration $BUILD_CONFIG --no-restore
        
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
        
      - name: Push to nuget
        working-directory: ./Source/dotnet-storedprocsgen
        run: dotnet nuget push **/*.nupkg -s https://api.nuget.org/v3/index.json --api-key ${{steps.login.outputs.NUGET_API_KEY}}       
